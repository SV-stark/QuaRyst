[package]
name = "quaryst"
version = "0.19.2"
description = "Ultrafast local text search"
authors = ["QuaRyst Team"]
repository = "https://github.com/SV-stark/QuaRyst"
edition = "2024"
rust-version = "1.95.0"
resolver = "3"

[package.metadata.wix]
upgrade-guid = "E1FACBD5-A11A-405C-8FDF-7206DC898547"
path-guid = "72F1EC5A-7926-484D-B438-FD5AD9F69BD6"
license = false
eula = false

[lib]
name = "quaryst"

[features]
default = []
# Kept for backwards-compatibility with build scripts; native parsers do not bundle Tesseract.
ocr = []

[build-dependencies]
winres = "0.1"
image = { version = "0.25", default-features = false, features = [
    "png",
    "ico",
] }

[dependencies]
# UI Framework
iced = { version = "0.14", features = ["image", "svg", "tokio", "lazy"] }
iced_aw = { version = "0.14", features = ["spinner", "badge", "card"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Search Engine
tantivy = "0.26"

# Metadata Database (Pure Rust KV store)
redb = "2.6"

# Concurrency & Parallelism
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "signal",
] }
rayon = "1.8"
parking_lot = "0.12"

# File System
notify = "8.2"
ignore = "0.4"
memmap2 = "0.9"
fd-lock = "4.0"

# Document Parsing (Pure Rust, synchronous, zero C/C++ deps)
unpdf = { version = "0.55.0", default-features = false, features = ["fast-parse"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

# Performance Libraries
mini-moka = "0.10"
fst = "0.4"
rkyv = { version = "0.8", features = ["bytecheck"] }
compact_str = { version = "0.9", features = ["rkyv", "serde"] }
smallvec = "1.13"
ahash = "0.8"
csv = "1.3"
memchr = "2.7"
aho-corasick = "1.1"


# Utilities
thiserror = "2.0"
blake3 = "1.5"
# OS CSPRNG for the local IPC token. Already present transitively via `rand`;
# declared directly because we call it.
getrandom = "0.3"
jiff = { version = "0.1", features = ["serde"] }
dirs = "6.0"
arboard = "3.4"
regex = "1"
opener = { version = "0.8", features = ["reveal"] }
rfd = "0.17"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
auto-launch = "0.6"
image = { version = "0.25", default-features = false, features = [
    "png",
    "ico",
] }
global-hotkey = "0.7"
self_update = { version = "0.44", features = ["rustls"] }
iced_highlighter = "0.14"
arc-swap = "1.6"
flume = "0.11"
globset = "0.4"

# MCP server (HTTP transport).
#
# Deliberately minimal: `http1` + `json` only, no TLS, no multipart, no
# compression. The listener is loopback-only and gated by the existing per-user
# token, so none of that is needed and every one of those features would add
# startup cost to a search app that is supposed to idle under 30 MB.
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }

# Performance & Observability
mimalloc = { version = "0.1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
log-panics = "2.1"
shadcn-iced = "0.3.0"

# calamine, sevenz-rust, and unrar are now redundant or handled by Kreuzberg

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.0"
divan = "0.1"
proptest = "1.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(windows)'] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "msi"]
# Keep custom Start Menu / Desktop shortcuts and DisplayIcon in wix/main.wxs
allow-dirty = ["msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Whether to install an updater program
install-updater = true
# Path that installers should place binaries in
install-path = "CARGO_HOME"

[workspace.metadata.dist.dependencies.apt]
libgtk-3-dev = "*"
"libglib2.0-dev" = "*"
pkg-config = "*"
